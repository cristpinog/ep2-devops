version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /services/catalog
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /services/inventory
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/catalog
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /services/inventory
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
